[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s03ft"
version = "2.1.0"
description = "S-03 freqtrade 交易流程：给 OpenClaw agent 直接调用的命令行库（不构成投资建议）"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "websocket-client>=1.7", "numpy>=1.26", "pandas>=2.2"]

[project.optional-dependencies]
trade = ["freqtrade==2026.9"]
test = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
s03ft = "s03ft.cli:main"

[tool.setuptools]
packages = ["s03ft", "fwresearch", "fwresearch.factors"]
